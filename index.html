<script>
document.querySelectorAll('a.c').forEach(function(a){
  try{
    var s=JSON.parse(localStorage.getItem(a.dataset.key)||'null'),st=a.querySelector('.st');
    if(!s||!s.ans)return;
    var n=Object.keys(s.ans).length;
    if(s.submitted){st.textContent='已交卷';st.className='st done'}
    else if(n>0){st.textContent='作答中 '+n+'/'+a.dataset.n;st.className='st doing'}
  }catch(e){}
});
